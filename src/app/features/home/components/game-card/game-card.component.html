<article [class]="'card ' + game().theme"><div class="decor"></div><div class="copy"><span class="eyebrow">{{ game().eyebrow }}</span><h2>{{ game().title }}</h2><p>{{ game().description }}</p></div><div class="art" aria-hidden="true"><span>{{ game().icon }}</span></div>@if (game().route) { <a [routerLink]="game().route" [attr.aria-label]="i18n.t('game.playAria') + ' ' + game().title"><b>→</b></a> } @else { <div class="locked"><span>🔒</span><small>{{ game().status }}</small></div> }</article>
