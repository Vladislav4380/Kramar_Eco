<header><a class="back" routerLink="/" [attr.aria-label]="i18n.t('common.back')">←</a><div class="score panel"><span class="coin">●</span><strong>{{ score() }}</strong></div><div class="time panel"><small>{{ i18n.t('hud.round') }} {{ round() }}</small><strong>{{ time() }}</strong><span class="progress"><i [style.width.%]="time() / 60 * 100"></i></span></div><div class="lives panel" [attr.aria-label]="i18n.t('hud.lives')">@for (life of [1,2,3]; track life) { <span class="life-bin" [class.empty]="life > lives()"></span> }</div><button class="pause" (click)="pause.emit()" [attr.aria-label]="i18n.t('hud.pause')">Ⅱ</button></header>
