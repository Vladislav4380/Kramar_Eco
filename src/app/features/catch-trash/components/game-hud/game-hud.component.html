<header><a routerLink="/" [attr.aria-label]="i18n.t('common.back')">←</a><div class="stat"><small>{{ i18n.t('hud.score') }}</small><strong>{{ score() }}</strong></div><div class="stat"><small>{{ i18n.t('hud.time') }}</small><strong>{{ time() }}</strong></div><div class="lives" [attr.aria-label]="i18n.t('hud.lives')">@for (heart of [1,2,3,4,5]; track heart) { <span [class.empty]="heart > lives()">♥</span> }</div><button (click)="pause.emit()" [attr.aria-label]="i18n.t('hud.pause')">Ⅱ</button></header>
